[tool:pytest]
# Pytest configuration for popofiler test suite

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = .

# Output options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=popofiler
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=term-missing
    --cov-fail-under=85
    --html=test_report.html
    --self-contained-html
    --json-report
    --json-report-file=test_report.json

# Markers for test categorization
markers =
    unit: Unit tests - isolated function testing
    integration: Integration tests - external system interactions
    security: Security tests - vulnerability and attack vector testing
    performance: Performance tests - timing and resource usage
    slow: Slow tests that take more than a few seconds
    network: Tests that require network connectivity
    docker: Tests that require Docker to be available
    kubernetes: Tests that require Kubernetes cluster access

# Minimum version
minversion = 7.0

# Test timeout (in seconds)
timeout = 300

# Ignore patterns
collect_ignore = [
    "setup.py",
    "build/",
    "dist/",
    ".tox/",
    ".venv/",
    "venv/",
]

# Filterwarnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning